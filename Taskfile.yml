version: '3'

tasks:
  install:
    desc: Install all dependencies using Poetry
    cmds:
      - poetry install

  collectstatic:
    desc: collect statics
    cmds:
      - poetry run python manage.py collectstatic

  runserver:
    desc: Start local server
    cmds:
      - poetry run python manage.py runserver

  migrate:
    desc: Migrate DB
    cmds:
      - poetry run python manage.py migrate

  makemigrations:
    desc: Create migrations for model
    cmds:
      - poetry run python manage.py makemigrations

  createsuperuser:
    desc: Create superuser
    cmds:
      - poetry run python manage.py createsuperuser

  shell:
    desc: Start django shell console
    cmds:
      - poetry run python manage.py shell

  up:
    desc: Start the whole stack (web, db, redis, celery) in Docker
    cmds:
      - docker compose up --build

  down:
    desc: Stop the stack
    cmds:
      - docker compose down

  test:
    desc: Run the test suite
    cmds:
      - poetry run pytest --cov=src --cov-report=term-missing

  lint:
    desc: Lint and format
    cmds:
      - poetry run ruff check --fix .
      - poetry run ruff format .

  check:
    desc: Django system checks, including deployment warnings
    cmds:
      - poetry run python manage.py check --deploy

  celery:
    desc: Start a Celery worker
    cmds:
      - poetry run celery -A config worker -l info
